name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      # tsc --checkJs over src and test, nothing is emitted
      - run: npm run typecheck

      # unit + end-to-end flow tests (in-process postgres and redis), fails under 75% line coverage
      - run: npm run test:coverage

      - run: npm audit --omit=dev --audit-level=high

  # migrations and boot against the real services the app uses in production
  smoke:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swiftdrop
          POSTGRES_PASSWORD: swiftdrop
          POSTGRES_DB: swiftdrop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swiftdrop" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgres://swiftdrop:swiftdrop@localhost:5432/swiftdrop
      DATABASE_SSL: disable
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --omit=dev

      - run: npm run migrate

      - name: boot and hit /health
        run: |
          node src/server.js &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health && exit 0
            sleep 1
          done
          echo "server never became healthy" && exit 1

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t swiftdrop-backend backend
